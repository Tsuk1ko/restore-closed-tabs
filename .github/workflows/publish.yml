name: Publish

on:
  push:
    branches:
      - "!*"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: publish-chrome
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and zip
        run: bun run zip

      - name: Upload to Chrome Web Store
        run: bun x wxt submit --chrome-api-version v2 --chrome-zip .output/*-chrome.zip
        env:
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}

      - name: Changelog
        uses: ardalanamini/auto-changelog@v5
        id: changelog

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          files: .output/*-chrome.zip
